
services:
  app:
    build:
      context: ./docker/php
      dockerfile: dockerfile
    container_name: mission_control_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mission_control}
      DB_USERNAME: ${DB_USERNAME:-mission_user}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env da raiz}
      PYTHON_API_URL: http://python-api:8001
    depends_on:
      db:
        condition: service_healthy
      python-api:
        condition: service_healthy
    networks:
      - mission_control

  python-api:
    build:
      context: ./python-api
    volumes:
      - ./python-api/tests:/tests:ro
    networks:
      - mission_control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - mission_control_frontend_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://nginx:80
      VITE_API_URL: ""
    command: ["sh", "-c", "npm ci --no-audit && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - nginx
    networks:
      - mission_control

  nginx:
    image: nginx:alpine
    container_name: mission_control_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mission_control

  db:
    image: mariadb:11.4
    container_name: mission_control_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-mission_control}
      MARIADB_USER: ${DB_USERNAME:-mission_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env da raiz}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env da raiz}
    ports:
      - "3307:3306"
    volumes:
      - mission_control_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mission_control

networks:
  mission_control:
    driver: bridge

volumes:
  mission_control_db_data:
  mission_control_frontend_modules:
