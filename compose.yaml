
services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mission_control_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mission_control

  nginx:
    image: nginx:alpine
    container_name: mission_control_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mission_control

  db:
    image: mariadb:11.4
    container_name: mission_control_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mission_control
      MARIADB_USER: mission_user
      MARIADB_PASSWORD: mission_password
      MARIADB_ROOT_PASSWORD: root_password_dev
    ports:
      - "3307:3306"
    volumes:
      - mission_control_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mission_control

networks:
  mission_control:
    driver: bridge

volumes:
  mission_control_db_data:
